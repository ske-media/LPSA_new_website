[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[dev]
command = "pnpm dev"
targetPort = 4321
port = 8888
framework = "#custom"
