[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[dev]
command = "pnpm dev"
targetPort = 4321
port = 8888
framework = "#custom"

# Visitors whose browser prefers English (or another non-French language) land on /en/.
# An explicit choice made with the language switch (cookie nf_lang) always wins.
[[redirects]]
from = "/"
to = "/en/"
status = 302
force = true
conditions = {Language = ["en", "de", "it", "es", "nl", "pt", "pl", "sv", "da", "no", "fi", "cs", "ja", "zh", "ko", "ar", "ru", "tr"]}
